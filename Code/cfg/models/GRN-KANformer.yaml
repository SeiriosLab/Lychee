
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ResNetLayer, [3, 64, 1, True, 1]] # 0，rtdetr-backbone,true is only Conv
  - [-1, 1, Conv, [256, 3, 2]] # 1,S2
  - [-1, 1, GhostResNetBlock, [256, 512, 2, False, 4, 0.25]] # 2,S3
  - [-1, 1, GhostResNetBlock, [512, 1024, 2, False, 6, 0.25]] # 3,S4
  - [-1, 1, GhostResNetBlock, [1024, 2048, 2, False, 3, 0.25]] # 4,S5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 5
  - [-1, 1, AIFI, [1024, 8]] # 6
  - [-1, 1, Conv, [256, 1, 1]] # 7

    #---------first depth---------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 8,F5
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9,S4 do CBS-k1
  - [[-2, -1], 1, Concat, [1]] # 10
  - [-1, 3, RepC3, [256]] # 11,S4 do CBS-k3
  - [-1, 1, Conv, [256, 1, 1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14,S3 do CBS-k1
  - [[-2, -1], 1, Concat, [1]] # 15
  - [-1, 3, RepC3, [256]] # 16,CCFF
  - [-1, 1, Conv, [256, 1, 1]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 19,S2 do CBS-k1
  - [[-2, -1], 1, Concat, [1]] # 20
  - [-1, 3, RepC3, [256]] # 21,CCFF

    #---------sencond depth---------
  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 17], 1, Concat, [1]] # 23
  - [-1, 3, RepC3, [256]] # 24,

  - [-1, 1, Conv, [256, 3, 2]] # 25 
  - [[-1, 12], 1, Concat, [1]] # 26
  - [-1, 3, RepC3, [256]] # 27

  - [-1, 1, Conv, [256, 3, 2]] # 28
  - [[-1, 7], 1, Concat, [1]] # 29
  - [-1, 3, RepC3, [256]] # 30

    #---------third depth---------
  - [23, 1, Conv, [256, 3, 2]] # 31
  - [-1, 1, ECA, [256]] # 32
  - [27, 1, Conv, [256, 3, 2]] # 33
  - [-1, 1, ECA, [256]] # 34

  - [[32, 34], 1, Concat, [1]] # 35
  - [-1, 3, RepC3, [256]] # 36

  - [[1, 21, 30, 36], 1, RTDETR_KANLinerHead_Decoder, [nc]] # 37
